name: Build NXEngine-Evo 60FPS SpeedUp

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev \
            libpng-dev libjpeg-dev libz-dev \
            libslirp-dev wget file libfuse2 \
            libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev

      - name: Patch Source for 60FPS SpeedUp
        run: |
          find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/delay = 20/delay = 16/g' {} +
          find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/20ms/16ms/g' {} +
          find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/TICKS_PER_SECOND = 50/TICKS_PER_SECOND = 60/g' {} +

      - name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)

      - name: Prepare AppDir
        run: |
          cd build
          make DESTDIR=../AppDir install
          
          # [핵심] 그래픽 라이브러리 충돌 방지: 
          # AppImage 내부에 포함된 libstdc++, libgcc_s 등을 삭제하여 
          # 호스트(Steam Deck) 시스템의 라이브러리를 쓰게 만듭니다.
          rm -rf ../AppDir/usr/lib/libstdc++.so* || true
          rm -rf ../AppDir/usr/lib/libgcc_s.so* || true

      - name: Download AppImage Tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Generate AppImage
        env:
          ARCH: x86_64
          OUTPUT_FILE: NXEngine-Evo-v2.6.5-1-Linux-x86_64.AppImage
          # [핵심 환경변수] 그래픽 드라이버를 시스템에서 가져오도록 강제
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          export PATH=".:$PATH"
          
          # linuxdeploy 실행
          # --exclude-library 옵션으로 시스템 핵심 그래픽 라이브러리가 번들링되는 것을 방지
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --exclude-library libGL.so.1 \
            --exclude-library libdrm.so.2 \
            --exclude-library libgbm.so.1 \
            --output appimage
          
          GENERATED_FILE=$(find . -maxdepth 1 -name "*.AppImage" ! -name "linuxdeploy*" | head -n 1)
          if [ -n "$GENERATED_FILE" ]; then
            mv "$GENERATED_FILE" "$OUTPUT_FILE"
          else
            echo "Error: AppImage not found."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NXEngine-Evo-60FPS-V3
          path: NXEngine-Evo-v2.6.5-1-Linux-x86_64.AppImage
