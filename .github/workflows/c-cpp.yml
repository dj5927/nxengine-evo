name: Build NXEngine-Evo AppImage

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libsdl2-image-dev \
            libpng-dev \
            libjpeg-dev \
            libz-dev \
            libslirp-dev \
            wget \
            file \
            libfuse2

      - name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)

      - name: Prepare AppDir
        run: |
          cd build
          make DESTDIR=../AppDir install

      - name: Download AppImage Tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Generate AppImage
        env:
          ARCH: x86_64
          OUTPUT_FILE: NXEngine-Evo-v2.6.5-1-Linux-x86_64.AppImage
        run: |
          # 플러그인 실행 경로를 현재 디렉토리로 설정 (매우 중요)
          export PATH=".:$PATH"
          
          # linuxdeploy 명령어를 최신 문법에 맞게 수정
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --output appimage
          
          # 생성된 파일명을 요청하신 형식으로 변경
          # 기본 이름은 보통 NXEngine_Evo-x86_64.AppImage 와 같은 형태입니다.
          mv *.AppImage "$OUTPUT_FILE"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NXEngine-Evo-v2.6.5-1-Linux-x86_64
          path: NXEngine-Evo-v2.6.5-1-Linux-x86_64.AppImage
