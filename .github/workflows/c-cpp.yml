name: Build NXEngine-Evo AppImage

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    # 대기 시간이 너무 길면 ubuntu-latest로 변경해 보세요.
    runs-on: ubuntu-20.04 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libpng-dev \
            libslirp-dev \
            wget \
            file

      - name: Configure and Build
        run: |
          mkdir build && cd build
          # 설치 경로를 /usr로 지정해야 AppImage 내부 구조와 일치합니다.
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)

      - name: Prepare AppDir
        run: |
          cd build
          # 임시 디렉토리에 빌드 결과물 수집
          make DESTDIR=../AppDir install

      - name: Download AppImage Tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Generate AppImage
        env:
          ARCH: x86_64
          OUTPUT_NAME: NXEngine-Evo-v2.6.5-1-Linux-x86_64.AppImage
        run: |
          # linuxdeploy 실행: 바이너리, 데스크탑 파일, 아이콘을 하나로 묶음
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --plugin appimage \
            --output appimage
          
          # 생성된 파일명을 요청하신 형식으로 변경
          # 기본 생성 이름이 NXEngine_Evo... 형식이므로 와일드카드로 매칭하여 변경합니다.
          mv NXEngine_Evo*.AppImage "$OUTPUT_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NXEngine-Evo-AppImage
          path: NXEngine-Evo-v2.6.5-1-Linux-x86_64.AppImage
